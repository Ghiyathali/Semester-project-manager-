appId: dev.semesterprojectmanager.app
productName: Semester Project Manager
copyright: Copyright (c) 2026 Semester Project Manager contributors
directories:
  output: release
  buildResources: resources
# Exclusion-based, so the production dependency tree (sql.js) is packaged
# automatically; electron-builder prunes devDependencies on its own.
files:
  - '!src/*'
  - '!**/*.map'
  - '!**/*.{ts,tsx}'
  - '!{.github,.vscode}/*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{electron.vite.config.ts,vite.web.config.ts,vitest.config.ts,eslint.config.mjs}'
  - '!{postcss.config.cjs,tailwind.config.cjs,.prettierrc,.gitignore}'
  - '!{README.md,CONTRIBUTING.md,CODE_OF_CONDUCT.md}'
extraResources:
  # sql.js loads its WebAssembly binary at runtime; keep it outside the asar so
  # the plain filesystem path in db/connection.ts resolves in a packaged build.
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  target: nsis
  artifactName: semester-project-manager-${version}-windows-x64-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target: dmg
  category: public.app-category.productivity
  artifactName: semester-project-manager-${version}-macos-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Office
  synopsis: Plan a semester or bachelor project with SCRUM inside the Unified Process
  artifactName: semester-project-manager-${version}-linux-x64.${ext}
