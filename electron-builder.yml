appId: dev.semesterprojectmanager.app
productName: Semester Project Manager
copyright: Copyright (c) 2026 Semester Project Manager contributors
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  # sql.js loads its WebAssembly binary at runtime; keep it outside the asar so
  # the plain filesystem path in db/connection.ts resolves in a packaged build.
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target: dmg
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Office
  artifactName: ${productName}-${version}.${ext}
